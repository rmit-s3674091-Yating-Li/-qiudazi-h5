name: Run repeat create event patch
on:
  push:
    branches:
      - fix/repeat-event-creation-entry
    paths:
      - scripts/patch-repeat-create-entry.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repeat-event-creation-entry
      - run: python scripts/patch-repeat-create-entry.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/Basics.tsx
          git commit -m "Keep create-event action visible after first event"
          git rm scripts/patch-repeat-create-entry.py .github/workflows/run-repeat-create-entry-patch.yml
          git commit -m "Remove temporary repeat-create patch files"
          git push origin HEAD:fix/repeat-event-creation-entry
