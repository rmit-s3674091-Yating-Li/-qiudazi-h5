name: Run navigation hierarchy patch
on:
  push:
    branches:
      - fix/navigation-hierarchy-cleanup
    paths:
      - scripts/patch-navigation-hierarchy.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/navigation-hierarchy-cleanup
      - run: python scripts/patch-navigation-hierarchy.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/Basics.tsx src/pages/ConnectionsPage.tsx
          git commit -m "Align navigation hierarchy with user roles"
          git rm scripts/patch-navigation-hierarchy.py .github/workflows/run-navigation-hierarchy-patch.yml
          git commit -m "Remove temporary navigation hierarchy files"
          git push origin HEAD:fix/navigation-hierarchy-cleanup
