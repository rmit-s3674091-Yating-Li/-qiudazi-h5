name: Run organizer participant patch
on:
  push:
    branches:
      - fix/organizer-participant-ia
    paths:
      - scripts/patch-organizer-participant.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/organizer-participant-ia
      - run: python scripts/patch-organizer-participant.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/EventPage.tsx src/components/EventInviteUI.tsx
          git commit -m "Separate organizer and participant signup IA"
          git rm scripts/patch-organizer-participant.py .github/workflows/run-organizer-participant-patch.yml
          git commit -m "Remove temporary organizer participant patch files"
          git push origin HEAD:fix/organizer-participant-ia
