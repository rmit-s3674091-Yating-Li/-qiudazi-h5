name: Integration Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/check-migration-parity.mjs'
      - 'qa/integration-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-contract-tests.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Verify live migrations are preserved before feature replay
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-parity.mjs --allow-repo-only
      - name: Verify exact repository/live migration parity on main
        if: github.event_name == 'push'
        run: node scripts/check-migration-parity.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize local Supabase config
        run: supabase init --force
      - name: Start isolated local Supabase
        run: supabase start
      - name: Replay repository migrations from clean database
        run: supabase db reset --local
      - name: Run integration contract tests
        run: npm run test:integration
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup
