name: Patch signup selection flow
on:
  push:
    branches: [fix/signup-selection-flow]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[signup-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/signup-selection-flow
      - name: Patch EventPage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/EventPage.tsx')
          s=p.read_text()
          old='''  useEffect(() => {\n    repository\n      .players()\n      .then((ps) => {\n        setPlayers(ps);\n        if (!manual)\n          setSelected(\n            ps.filter((p) => p.player_type === "self").map((p) => p.id),\n          );\n      })\n      .catch((e) => setError(explainError(e)));\n  }, [manual]);'''
          new='''  useEffect(() => {\n    repository\n      .players()\n      .then((ps) => {\n        setPlayers(ps);\n        // Do not preselect or lock the current user. Signup is about choosing\n        // who is actually playing in this entry, including proxy signup.\n        setSelected([]);\n      })\n      .catch((e) => setError(explainError(e)));\n  }, [manual]);'''
          assert old in s
          s=s.replace(old,new)
          old='''  const taken = new Set(\n    s.entries\n      .filter((e) => e.status !== "withdrawn")\n      .flatMap((e) => e.players.map((p) => p.id)),\n  );'''
          new='''  const taken = new Set(\n    s.entries\n      .filter((e) => e.status !== "withdrawn")\n      .flatMap((e) => e.players.map((p) => p.id)),\n  );\n  const selectedPlayers = players.filter((p) => selected.includes(p.id));\n  const hasProxyPlayer = selectedPlayers.some((p) => p.player_type !== "self");'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('disabled={taken.has(p.id) || (!manual && p.player_type === "self")}', 'disabled={taken.has(p.id)}')
          old='''      <label className="check">\n        <input\n          type="checkbox"\n          checked={consent}\n          onChange={(e) => setConsent(e.target.checked)}\n        />\n        <span>已确认参赛信息；临时参赛者已取得本人许可。</span>\n      </label>'''
          new='''      {hasProxyPlayer && (\n        <label className="check">\n          <input\n            type="checkbox"\n            checked={consent}\n            onChange={(e) => setConsent(e.target.checked)}\n          />\n          <span>我已获得所选参赛者同意，代其提交本次赛事报名信息。</span>\n        </label>\n      )}'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('''          !consent ||\n          selected.some((id) => taken.has(id))''','''          (hasProxyPlayer && !consent) ||\n          selected.some((id) => taken.has(id))''')
          s=s.replace('''            ? "双打报名"\n            : "确认报名"''','''            ? "选择双打参赛者"\n            : "选择参赛者"''')
          p.write_text(s)
          Path('.github/workflows/patch-signup-flow.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "qiudazi-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/EventPage.tsx .github/workflows/patch-signup-flow.yml
          git commit -m "Fix signup participant selection [signup-patched]"
          git push origin HEAD:fix/signup-selection-flow
