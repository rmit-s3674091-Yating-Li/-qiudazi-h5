name: Patch repeat event creation entry
on:
  push:
    branches: [fix/repeat-event-creation-entry-v2]
    paths: ['.github/workflows/patch-repeat-create.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repeat-event-creation-entry-v2
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Basics.tsx')
          s=p.read_text()
          old='{mine && <EventInviteInboxLink />}'
          new='''{mine && (\n          <>\n            <EventInviteInboxLink />\n            <Link className="card row between" to="/events/new">\n              <div>\n                <strong>创建新赛事</strong>\n                <p className="muted small">随时再发起一场单打或双打比赛</p>\n              </div>\n              <Plus size={20} />\n            </Link>\n          </>\n        )}'''
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new))
          PY
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/Basics.tsx
          git commit -m "Keep create event entry visible after first event"
          git rm .github/workflows/patch-repeat-create.yml
          git commit -m "Remove temporary repeat creation patch workflow"
          git push origin HEAD:fix/repeat-event-creation-entry-v2