name: H5 Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run build

  supabase-clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize local Supabase config
        run: supabase init --force
      - name: Start isolated local Supabase
        run: supabase start
      - name: Replay repository migrations from a clean database
        run: supabase db reset --local
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup
