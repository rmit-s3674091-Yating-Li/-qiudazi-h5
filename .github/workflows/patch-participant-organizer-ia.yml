name: Patch organizer and participant signup IA
on:
  push:
    branches: [fix/participant-organizer-ia-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/participant-organizer-ia-v2
      - name: Patch pages
        run: python scripts/patch_participant_ia.py
      - name: Commit patch
        run: |
          git config user.name "qiudazi-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Separate organizer and participant signup IA [participant-ia-patched]"
          git push origin HEAD:fix/participant-organizer-ia-v2
