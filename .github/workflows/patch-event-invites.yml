name: Patch in-app event invite entry points
on:
  push:
    branches: [feat/in-app-event-invites]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[event-invites-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/in-app-event-invites
      - name: Patch pages
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/pages/Basics.tsx')
          s=p.read_text()
          anchor='import { imageBlob } from "../utils/images";\n'
          assert anchor in s
          s=s.replace(anchor, anchor+'import { EventInviteInboxLink } from "../components/EventInviteUI";\n')
          anchor='''        <div className="section-heading">\n          <h2>{mine ? "我的赛场" : "最近的比赛"}</h2>'''
          assert anchor in s
          s=s.replace(anchor, '''        {mine && <EventInviteInboxLink />}\n        <div className="section-heading">\n          <h2>{mine ? "我的赛场" : "最近的比赛"}</h2>''')
          p.write_text(s)

          p=Path('src/pages/EventPage.tsx')
          s=p.read_text()
          anchor='''import {\n  DrawPanel,\n  RankingPanel,\n  PhotoPanel,\n} from "../components/TournamentPanels";\n'''
          assert anchor in s
          s=s.replace(anchor, anchor+'import { EventInviteSheet } from "../components/EventInviteUI";\n')
          anchor='''    [notice, setNotice] = useState(""),\n    [busy, setBusy] = useState(false),'''
          assert anchor in s
          s=s.replace(anchor, '''    [notice, setNotice] = useState(""),\n    [inviteOpen, setInviteOpen] = useState(false),\n    [busy, setBusy] = useState(false),''')
          anchor='''            {owner && e.status === "signup" && (\n              <Link\n                className="button secondary full"\n                to={"/events/" + id + "/edit"}\n              >\n                编辑赛事\n              </Link>\n            )}\n'''
          assert anchor in s
          replacement=anchor+'''            {e.status === "signup" && (\n              <button className="secondary full" onClick={() => setInviteOpen(true)}>\n                邀请球搭子参赛\n              </button>\n            )}\n'''
          s=s.replace(anchor,replacement)
          anchor='''      {signup && (\n        <SignupSheet'''
          assert anchor in s
          s=s.replace(anchor, '''      <EventInviteSheet eventId={e.id} open={inviteOpen} onClose={() => setInviteOpen(false)} />\n      {signup && (\n        <SignupSheet''')
          p.write_text(s)

          Path('.github/workflows/patch-event-invites.yml').unlink()
          PY
      - name: Commit wiring
        run: |
          git config user.name "qiudazi-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Basics.tsx src/pages/EventPage.tsx .github/workflows/patch-event-invites.yml
          git commit -m "Wire in-app event invitations [event-invites-wired]"
          git push origin HEAD:feat/in-app-event-invites
