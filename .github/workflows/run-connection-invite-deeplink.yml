name: Run connection invite deep-link patch
on:
  push:
    branches:
      - fix/connection-invite-deeplink
    paths:
      - scripts/patch-connection-invite-deeplink.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/connection-invite-deeplink
      - run: python scripts/patch-connection-invite-deeplink.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/ConnectionsPage.tsx src/main.tsx
          git commit -m "Make connection invite links robust in mobile browsers"
          git rm scripts/patch-connection-invite-deeplink.py .github/workflows/run-connection-invite-deeplink.yml
          git commit -m "Remove temporary invite deep-link patch files"
          git push origin HEAD:fix/connection-invite-deeplink
