name: Run event invite participation scope patch
on:
  push:
    branches:
      - fix/event-invite-participation-scope
    paths:
      - scripts/patch-event-invite-scope.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-invite-participation-scope
      - run: python scripts/patch-event-invite-scope.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/Basics.tsx
          git commit -m "Move event invitations into participation scope"
          git rm scripts/patch-event-invite-scope.py .github/workflows/run-event-invite-scope-patch.yml
          git commit -m "Remove temporary invite scope patch files"
          git push origin HEAD:fix/event-invite-participation-scope
