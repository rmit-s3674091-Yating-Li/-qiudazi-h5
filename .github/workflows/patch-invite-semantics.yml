name: Patch invite entry semantics
on:
  push:
    branches: [fix/invite-entry-semantics]
    paths: [.github/workflows/patch-invite-semantics.yml]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[invite-semantics-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch event invite entry points
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/EventPage.tsx')
          s=p.read_text()
          old='''            {e.status === "signup" && (\n              <button className="secondary full" onClick={() => setInviteOpen(true)}>\n                邀请球搭子参赛\n              </button>\n            )}'''
          new='''            {owner && e.status === "signup" && (\n              <button className="secondary full" onClick={() => setInviteOpen(true)}>\n                邀请球搭子参赛\n              </button>\n            )}'''
          if old not in s: raise SystemExit('event invite button pattern not found')
          p.write_text(s.replace(old,new,1))
          p=Path('src/components/EventInviteUI.tsx')
          s=p.read_text()
          old='''        <p className="muted">这里仅处理参赛邀请，不是聊天消息。</p>'''
          new='''        <p className="muted">接受表示你愿意参加；请进入赛事详情后点击“立即报名”，选择本次实际参赛者并完成报名。</p>'''
          if old not in s: raise SystemExit('invite inbox copy pattern not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit fix
        run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/EventPage.tsx src/components/EventInviteUI.tsx
          git commit -m "Clarify organizer invites and signup handoff [invite-semantics-fixed]" || exit 0
          git push