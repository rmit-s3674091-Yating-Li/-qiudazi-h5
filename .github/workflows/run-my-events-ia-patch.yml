name: Run My Events IA cleanup
on:
  push:
    branches:
      - fix/my-events-information-architecture
    paths:
      - scripts/patch-my-events-ia.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/my-events-information-architecture
      - run: python scripts/patch-my-events-ia.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/Basics.tsx
          git commit -m "Clarify My Events created joined and invite hierarchy"
          git rm scripts/patch-my-events-ia.py .github/workflows/run-my-events-ia-patch.yml
          git commit -m "Remove temporary My Events IA patch files"
          git push origin HEAD:fix/my-events-information-architecture
