name: Run My Events hierarchy patch
on:
  push:
    branches:
      - fix/repeat-event-creation-entry
    paths:
      - scripts/patch-my-events-header.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repeat-event-creation-entry
      - run: python scripts/patch-my-events-header.py
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name qiudazi-maintenance
          git config user.email actions@users.noreply.github.com
          git add src/pages/Basics.tsx src/pages/ConnectionsPage.tsx
          git commit -m "Align My Events and ball-partner action hierarchy"
          git rm scripts/patch-my-events-header.py .github/workflows/run-my-events-header-patch.yml
          git commit -m "Remove temporary hierarchy patch files"
          git push origin HEAD:fix/repeat-event-creation-entry
